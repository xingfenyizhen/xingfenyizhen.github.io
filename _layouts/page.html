---
layout: default
---

{% assign header_image = page.header_image | default: site.header_image %}
<header class="hero hero-page" style="background-image: linear-gradient(rgba(0,0,0,.38), rgba(0,0,0,.38)), url('{{ header_image | relative_url }}')">
  <div class="hero-content">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </div>
</header>

<div class="content-grid page-width page-content-grid">
  <article class="prose page-prose">
    {{ content }}
  </article>
  <aside class="sidebar compact-sidebar" aria-label="博客信息">
    <section class="about-card">
      <div class="avatar" aria-hidden="true">Z</div>
      <p>{{ site.sidebar_description }}</p>
    </section>
  </aside>
</div>
